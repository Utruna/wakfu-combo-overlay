name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Everything that can refuse the release, before anything is built.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Without the key the build can't sign the updates, and an unsigned
      # update would be refused by every installed copy — fail before building.
      - name: Check the updater signing key is configured
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Ensure this version hasn't already been released
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          # A leftover draft from a failed run is fine — it gets reused below.
          IS_DRAFT="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$IS_DRAFT" = "false" ]; then
            echo "::error::Release $VERSION already exists. Bump the version in package.json before re-running this workflow."
            exit 1
          fi
          echo "No existing release for $VERSION — proceeding."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release text is this version's section of CHANGELOG.md — checked
      # before building, so a release never goes out without its notes.
      - name: Check this version's notes are in CHANGELOG.md
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          awk -v v="$VERSION" '
            { sub(/\r$/, "") }
            /^## / { inside = ($2 == v); next }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::No '## $VERSION' section in CHANGELOG.md. Add one before re-running this workflow."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # Each system builds (and tests) its own. Nothing is tagged or published
  # yet: a failing build must not leave a tag or a half-filled release behind.
  build:
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        include:
          - system: windows
            runner: windows-latest
          # The oldest supported Ubuntu: an AppImage runs on distros at least
          # as recent as the one it was built on.
          - system: linux
            runner: ubuntu-22.04
          # One universal app, for Apple Silicon and Intel Macs alike.
          - system: macos
            runner: macos-latest
            build-args: --target universal-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          if [ "${{ matrix.system }}" = macos ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Install Linux build dependencies
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The signing key signs what the in-app updater downloads; it refuses
      # any update whose signature doesn't match the public key in
      # src-tauri/tauri.conf.json.
      - name: Build
        run: npx tauri build ${{ matrix.build-args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Collect the release files
        run: node tools/release_manifests.js collect ${{ matrix.system }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.system }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Write the update manifests
        run: node tools/release_manifests.js manifests

      - name: Extract this version's notes from CHANGELOG.md
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          awk -v v="$VERSION" '
            { sub(/\r$/, "") }
            /^## / { inside = ($2 == v); next }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create and push the release tag
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          # Idempotent on retry: a prior attempt may have pushed the tag and
          # then failed later, which would otherwise make this step fail with
          # "tag already exists" on re-run.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists on origin — reusing it."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      # Created as a draft, so the files are uploaded into it and it only
      # goes public once every one of them is there (an updater reading a
      # release that has the installer but not yet latest.json would fail).
      - name: Create draft release
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft release $VERSION already exists — reusing it."
          else
            # The changelog first, then GitHub's list of merged PRs and the
            # "Full Changelog" compare link.
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The signatures are already in latest.json: only the files people (and
      # the updater) download go up.
      - name: Upload the release files and update manifests
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          find dist -maxdepth 1 -type f ! -name '*.sig' -print0 \
            | xargs -0 gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
