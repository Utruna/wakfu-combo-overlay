name: Build & Release (Windows)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Ensure this version hasn't already been released
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          # A leftover draft from a failed run is fine — it gets reused below.
          IS_DRAFT="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$IS_DRAFT" = "false" ]; then
            echo "::error::Release $VERSION already exists. Bump the version in package.json before re-running this workflow."
            exit 1
          fi
          echo "No existing release for $VERSION — proceeding."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the release tag
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          # Idempotent on retry: a prior attempt may have pushed the tag and
          # then failed later (e.g. the build step), which would otherwise
          # make this step fail with "tag already exists" on re-run.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists on origin — reusing it."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      # Created up front as a draft, so the files are uploaded into it and it
      # only goes public once every one of them is there (an updater reading a
      # release that has the installer but not yet latest.json would fail).
      - name: Create draft release
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft release $VERSION already exists — reusing it."
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$VERSION"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The signing key signs the installer for the in-app updater, which
      # refuses any update whose signature doesn't match the public key in
      # src-tauri/tauri.conf.json.
      - name: Build Windows installer
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Upload installer and update manifests
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node tools/release_manifests.js
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber             "dist/wakfu-combo-overlay-setup-$VERSION.exe" dist/latest.json dist/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
