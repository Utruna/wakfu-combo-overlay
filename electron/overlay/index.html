<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wakfu Combo Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="combo-overlay">
    <div id="lead-wrap">
      <div id="class-lead-icon" aria-hidden="true"></div>
      <div id="turn-damage" hidden>
        <div class="td-frame"></div>
        <div class="td-fill"></div>
        <div class="td-body"><span class="td-tag">Tour</span><span class="td-value"></span></div>
      </div>
    </div>
    <div id="combo-log" aria-live="polite"></div>
  </div>
  <script src="client.js"></script>
</body>
</html>
