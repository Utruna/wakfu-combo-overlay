<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wakfu Combo Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="combo-overlay">
    <div id="lead-wrap">
      <div id="class-lead-icon" aria-hidden="true"></div>
      <div id="turn-damage" hidden>
        <div class="td-frame"></div>
        <div class="td-fill"></div>
        <div class="td-body"><span class="td-tag">Tour</span><span class="td-value"></span></div>
      </div>
      <!-- Heals and armour the hero gave: hidden while at 0. -->
      <div id="support" hidden>
        <div class="sp sp-heal empty" aria-label="Soins">
          <div class="sp-frame"></div><div class="sp-fill"></div>
          <div class="sp-body"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7-4.4-9.5-8.5C.5 9 2.5 5 6.5 5c2.2 0 3.6 1.2 5.5 3.2C13.9 6.2 15.3 5 17.5 5c4 0 6 4 4 7.5C19 16.6 12 21 12 21z"/></svg><span class="sp-value"></span></div>
        </div>
        <div class="sp sp-armor empty" aria-label="Armure">
          <div class="sp-frame"></div><div class="sp-fill"></div>
          <div class="sp-body"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5z"/></svg><span class="sp-value"></span></div>
        </div>
      </div>
    </div>
    <div id="combo-log" aria-live="polite"></div>
  </div>
  <script src="client.js"></script>
</body>
</html>
